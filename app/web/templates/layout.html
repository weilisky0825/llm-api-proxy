<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - LLM API Proxy</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/alpinejs@3.14.8" defer></script>
    {% if charts %}
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7"></script>
    {% endif %}
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.6/marked.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        [x-cloak] { display: none !important; }
        .markdown-body h1 { font-size: 1.5rem; font-weight: 700; margin: 1rem 0 0.5rem; }
        .markdown-body h2 { font-size: 1.25rem; font-weight: 700; margin: 0.75rem 0 0.5rem; }
        .markdown-body h3 { font-size: 1.1rem; font-weight: 700; margin: 0.5rem 0 0.25rem; }
        .markdown-body p { margin: 0.5rem 0; line-height: 1.6; }
        .markdown-body pre { background: #1a1a2e; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; }
        .markdown-body code { background: #334155; padding: 0.125rem 0.375rem; border-radius: 0.25rem; font-size: 0.875em; }
        .markdown-body pre code { background: transparent; padding: 0; }
        .markdown-body ul, .markdown-body ol { margin-left: 1.5rem; margin-bottom: 0.5rem; }
        .markdown-body blockquote { border-left: 3px solid #4b5563; padding-left: 1rem; color: #9ca3af; margin: 0.5rem 0; }
        .markdown-body table { border-collapse: collapse; width: 100%; margin: 0.5rem 0; }
        .markdown-body th, .markdown-body td { border: 1px solid #374151; padding: 0.5rem; text-align: left; }
        .markdown-body th { background: #1f2937; }
        .markdown-body hr { border-color: #374151; margin: 1rem 0; }
        .markdown-body a { color: #60a5fa; text-decoration: underline; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <div class="flex">
        <!-- Sidebar -->
        <aside class="w-56 bg-gray-800 min-h-screen p-4 fixed left-0 top-0">
            <div class="mb-8 px-2">
                <h1 class="text-lg font-bold text-white">LLM API Proxy</h1>
                <p class="text-xs text-gray-400">v0.1.0</p>
            </div>
            <nav class="space-y-1">
                <a href="/admin" class="flex items-center px-4 py-2 rounded-lg transition-colors cursor-pointer {% if active == 'dashboard' %}bg-blue-700 text-white{% else %}text-gray-300 hover:bg-gray-700 hover:text-white{% endif %}">
                    <span class="mr-3">📊</span> 首页概览
                </a>
                <a href="/admin/users" class="flex items-center px-4 py-2 rounded-lg transition-colors cursor-pointer {% if active == 'users' %}bg-blue-700 text-white{% else %}text-gray-300 hover:bg-gray-700 hover:text-white{% endif %}">
                    <span class="mr-3">👥</span> 用户管理
                </a>
                <a href="/admin/config" class="flex items-center px-4 py-2 rounded-lg transition-colors cursor-pointer {% if active == 'config' %}bg-blue-700 text-white{% else %}text-gray-300 hover:bg-gray-700 hover:text-white{% endif %}">
                    <span class="mr-3">⚙️</span> 系统配置
                </a>
                <a href="/admin/live" class="flex items-center px-4 py-2 rounded-lg transition-colors cursor-pointer {% if active == 'live' %}bg-blue-700 text-white{% else %}text-gray-300 hover:bg-gray-700 hover:text-white{% endif %}">
                    <span class="mr-3">📡</span> 实时日志
                </a>
                <a href="/admin/logs" class="flex items-center px-4 py-2 rounded-lg transition-colors cursor-pointer {% if active == 'logs' %}bg-blue-700 text-white{% else %}text-gray-300 hover:bg-gray-700 hover:text-white{% endif %}">
                    <span class="mr-3">🔍</span> 日志查询
                </a>
                <a href="/admin/test" class="flex items-center px-4 py-2 rounded-lg transition-colors cursor-pointer {% if active == 'test' %}bg-blue-700 text-white{% else %}text-gray-300 hover:bg-gray-700 hover:text-white{% endif %}">
                    <span class="mr-3">🧪</span> API 测试
                </a>
                <a href="/admin/health" class="flex items-center px-4 py-2 rounded-lg transition-colors cursor-pointer {% if active == 'health' %}bg-blue-700 text-white{% else %}text-gray-300 hover:bg-gray-700 hover:text-white{% endif %}">
                    <span class="mr-3">💚</span> 健康检查
                </a>
                <a href="/admin/stats" class="flex items-center px-4 py-2 rounded-lg transition-colors cursor-pointer {% if active == 'stats' %}bg-blue-700 text-white{% else %}text-gray-300 hover:bg-gray-700 hover:text-white{% endif %}">
                    <span class="mr-3">📈</span> 请求统计
                </a>
                <div class="mt-8 pt-4 border-t border-gray-700">
                    <div class="flex items-center justify-between px-4 py-2">
                        <span class="text-xs text-gray-400">管理员: <span id="adminName">—</span></span>
                        <button onclick="adminLogout()" class="text-xs text-gray-400 hover:text-white">退出</button>
                    </div>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="ml-56 flex-1 p-6">
            <h2 class="text-2xl font-bold mb-6 text-white">{{ title }}</h2>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>

<script>
async function loadAdminName() {
    try {
        const res = await fetch('/api/admin/admin/me');
        const data = await res.json();
        const el = document.getElementById('adminName');
        if (el) el.textContent = data.username;
    } catch {}
}
async function adminLogout() {
    await fetch('/api/admin/admin/logout', {method: 'POST'});
    window.location.href = '/admin/login';
}
document.addEventListener('DOMContentLoaded', loadAdminName);
</script>
</html>
